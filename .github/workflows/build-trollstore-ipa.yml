name: Build Codync iOS 16 TrollStore IPA

on:
  push:
    branches:
      - ios-16-trollstore
      - main
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-ipa:
    name: Build TrollStore IPA (iOS 16.0+)
    runs-on: macos-15
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Select Xcode 16
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16.0'

      - name: Install xcodegen
        run: |
          brew install xcodegen

      - name: Build TrollStore IPA
        run: |
          bash tooling/build-codync-ipa.sh

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Codync-TrollStore
          path: build/trollstore/Codync-TrollStore.ipa
          if-no-files-found: error

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name || 'v2.36.0-ios16' }}
          name: Codync for iOS (TrollStore Edition iOS 16.0+) ${{ github.ref_name || 'v2.36.0' }}
          body: |
            ### Codync iOS 巨魔专用版 (iOS 16.0+ TrollStore Edition)
            - 降级适配 iOS 16.0+，支持 iOS 16.x 巨魔直装。
            - 引入 Point-Free `swift-perception`，完全平替 Observation 框架。
            - 剥离商业云 ClerkKit 强制依赖，支持直接局域网/配对码连接 coding agent 宿主机。
            - 注入 TrollStore 无沙盒与后台保活 Entitlements。
          files: |
            build/trollstore/Codync-TrollStore.ipa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
